name: PreethiMart CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Verify (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify PreparedStatement compliance
        run: |
          echo "Scanning for non-parameterized raw statements..."
          ! grep -rn "Statement)" src/main/java/com/preethi/preethimart/dao/ | grep -v "PreparedStatement" || exit 1

      - name: Run Maven Build and Tests
        run: mvn -B clean verify --file pom.xml
